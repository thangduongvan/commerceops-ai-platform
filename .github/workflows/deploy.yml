name: Build and Deploy to ECS

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "Dockerfile"
      - "requirements.txt"
      - ".github/workflows/deploy.yml"
  workflow_dispatch: {}

permissions:
  id-token: write # required to request the OIDC JWT
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" -t "$ECR_REGISTRY/$ECR_REPOSITORY:latest" .
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:latest"

      # V7: same image, four ECS services (product / order / payment / worker).
      # Task defs still reference ":latest"; force-new-deployment re-pulls.
      - name: Force new ECS deployments
        env:
          CLUSTER: ${{ vars.ECS_CLUSTER }}
          # Comma-separated; set ECS_SERVICES in repo vars, or fall back to
          # the legacy single ECS_SERVICE plus conventional suffixes.
          SERVICES: ${{ vars.ECS_SERVICES }}
          LEGACY_SERVICE: ${{ vars.ECS_SERVICE }}
        run: |
          if [ -n "$SERVICES" ]; then
            IFS=',' read -ra SVCS <<< "$SERVICES"
          else
            # Derive product/order/payment/worker from a product (or app) name.
            BASE="${LEGACY_SERVICE%-product}"
            BASE="${BASE%-app}"
            SVCS=("${BASE}-product" "${BASE}-order" "${BASE}-payment" "${BASE}-worker")
          fi
          for svc in "${SVCS[@]}"; do
            echo "Redeploying $svc ..."
            aws ecs update-service \
              --cluster "$CLUSTER" \
              --service "$svc" \
              --force-new-deployment
          done

      - name: Wait for services to stabilize
        env:
          CLUSTER: ${{ vars.ECS_CLUSTER }}
          SERVICES: ${{ vars.ECS_SERVICES }}
          LEGACY_SERVICE: ${{ vars.ECS_SERVICE }}
        run: |
          if [ -n "$SERVICES" ]; then
            IFS=',' read -ra SVCS <<< "$SERVICES"
          else
            BASE="${LEGACY_SERVICE%-product}"
            BASE="${BASE%-app}"
            SVCS=("${BASE}-product" "${BASE}-order" "${BASE}-payment" "${BASE}-worker")
          fi
          aws ecs wait services-stable \
            --cluster "$CLUSTER" \
            --services "${SVCS[@]}"

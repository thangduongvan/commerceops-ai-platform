# V7 (Microservices): Product / Order / Payment as separate processes with
# database-per-service, plus an nginx path-based gateway on :8000.
# See docs/adr/ADR-008-microservices.md.

services:
  product-db:
    image: postgres:16
    environment:
      POSTGRES_USER: commerceops
      POSTGRES_PASSWORD: commerceops
      POSTGRES_DB: commerceops_product
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - max_wal_senders=10
      - -c
      - max_replication_slots=10
      - -c
      - hot_standby=on
    ports:
      - "5432:5432"
    volumes:
      - product_db_data:/var/lib/postgresql/data
      - ./infra/postgres/product/init-replication.sh:/docker-entrypoint-initdb.d/01-init-replication.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U commerceops -d commerceops_product"]
      interval: 5s
      timeout: 5s
      retries: 10

  product-db-replica:
    image: postgres:16
    user: postgres
    environment:
      PRIMARY_HOST: product-db
      REPLICATOR_USER: replicator
      REPLICATOR_PASSWORD: commerceops
      REPLICATION_SLOT: commerceops_standby
      PGDATA: /var/lib/postgresql/data
    ports:
      - "5433:5432"
    volumes:
      - product_db_replica_data:/var/lib/postgresql/data
      - ./infra/postgres/product/standby-entrypoint.sh:/standby-entrypoint.sh:ro
    entrypoint: ["/bin/bash", "/standby-entrypoint.sh"]
    depends_on:
      product-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U commerceops && psql -U commerceops -d commerceops_product -tAc 'SELECT pg_is_in_recovery()' | grep -q t"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  order-db:
    image: postgres:16
    environment:
      POSTGRES_USER: commerceops
      POSTGRES_PASSWORD: commerceops
      POSTGRES_DB: commerceops_order
    ports:
      - "5434:5432"
    volumes:
      - order_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U commerceops -d commerceops_order"]
      interval: 5s
      timeout: 5s
      retries: 10

  payment-db:
    image: postgres:16
    environment:
      POSTGRES_USER: commerceops
      POSTGRES_PASSWORD: commerceops
      POSTGRES_DB: commerceops_payment
    ports:
      - "5435:5432"
    volumes:
      - payment_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U commerceops -d commerceops_payment"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  localstack:
    image: localstack/localstack:3
    environment:
      SERVICES: sqs
    ports:
      - "4566:4566"
    volumes:
      - ./infra/localstack/create-queues.sh:/etc/localstack/init/ready.d/create-queues.sh
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 5s
      retries: 20

  payment-gateway:
    build: .
    command: uvicorn fake_gateway.main:app --host 0.0.0.0 --port 9000
    environment:
      GATEWAY_SUCCESS_RATE: "0.8"
      GATEWAY_ERROR_RATE: "0"
      GATEWAY_HANG_RATE: "0"
      GATEWAY_LATENCY_MS: "0"
    ports:
      - "9000:9000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9000/health')"]
      interval: 5s
      timeout: 5s
      retries: 10

  product:
    build: .
    command: ["uvicorn", "app.product.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      SERVICE_NAME: product
      DATABASE_URL: postgresql+psycopg://commerceops:commerceops@product-db:5432/commerceops_product
      DATABASE_READ_URL: postgresql+psycopg://commerceops:commerceops@product-db-replica:5432/commerceops_product
      READ_REPLICA_ENABLED: "true"
      DB_POOL_RECYCLE_SECONDS: "300"
      APP_NAME: CommerceOps AI Platform
      ENVIRONMENT: local
      REDIS_URL: redis://redis:6379/0
      CACHE_TTL_SECONDS: 15
      CACHE_ENABLED: "true"
    ports:
      - "8001:8000"
    depends_on:
      product-db:
        condition: service_healthy
      product-db-replica:
        condition: service_healthy
      redis:
        condition: service_healthy

  order:
    build: .
    command: ["uvicorn", "app.order.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      SERVICE_NAME: order
      DATABASE_URL: postgresql+psycopg://commerceops:commerceops@order-db:5432/commerceops_order
      READ_REPLICA_ENABLED: "false"
      DB_POOL_RECYCLE_SECONDS: "300"
      APP_NAME: CommerceOps AI Platform
      ENVIRONMENT: local
      REDIS_URL: redis://redis:6379/0
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      SQS_ENDPOINT_URL: http://localstack:4566
      PRODUCT_SERVICE_URL: http://product:8000
      PAYMENT_SERVICE_URL: http://payment:8000
    ports:
      - "8002:8000"
    depends_on:
      order-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      localstack:
        condition: service_healthy
      product:
        condition: service_started
      payment:
        condition: service_started

  payment:
    build: .
    command: ["uvicorn", "app.payment.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      SERVICE_NAME: payment
      DATABASE_URL: postgresql+psycopg://commerceops:commerceops@payment-db:5432/commerceops_payment
      READ_REPLICA_ENABLED: "false"
      APP_NAME: CommerceOps AI Platform
      ENVIRONMENT: local
      PAYMENT_GATEWAY_URL: http://payment-gateway:9000
    ports:
      - "8003:8000"
    depends_on:
      payment-db:
        condition: service_healthy
      payment-gateway:
        condition: service_healthy

  worker:
    build: .
    command: python -m app.worker
    environment:
      SERVICE_NAME: worker
      DATABASE_URL: postgresql+psycopg://commerceops:commerceops@order-db:5432/commerceops_order
      READ_REPLICA_ENABLED: "false"
      DB_POOL_RECYCLE_SECONDS: "300"
      APP_NAME: CommerceOps AI Platform
      ENVIRONMENT: local
      REDIS_URL: redis://redis:6379/0
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      SQS_ENDPOINT_URL: http://localstack:4566
    depends_on:
      order-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      localstack:
        condition: service_healthy

  gateway:
    image: nginx:1.27-alpine
    ports:
      - "8000:8000"
    volumes:
      - ./infra/nginx/gateway.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - product
      - order
      - payment

volumes:
  product_db_data:
  product_db_replica_data:
  order_db_data:
  payment_db_data:

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: commerceops
      POSTGRES_PASSWORD: commerceops
      POSTGRES_DB: commerceops
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U commerceops"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://commerceops:commerceops@db:5432/commerceops
      APP_NAME: CommerceOps AI Platform
      ENVIRONMENT: local
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:

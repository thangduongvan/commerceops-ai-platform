services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: commerceops
      POSTGRES_PASSWORD: commerceops
      POSTGRES_DB: commerceops
    # V6 (Database HA): enable WAL shipping so db-replica can stream.
    # Asynchronous by default (matches an RDS read replica). For the RPO
    # experiment that needs synchronous commit, append:
    #   -c synchronous_standby_names='*'
    # to this command — and observe that the primary then blocks when the
    # standby is gone. That is exactly why RDS Multi-AZ needs a healthy
    # standby. See docs/adr/ADR-007-database-ha.md.
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - max_wal_senders=10
      - -c
      - max_replication_slots=10
      - -c
      - hot_standby=on
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./infra/postgres/init-replication.sh:/docker-entrypoint-initdb.d/01-init-replication.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U commerceops"]
      interval: 5s
      timeout: 5s
      retries: 10

  # V6: hot standby via streaming replication. Own endpoint on :5433 so the
  # app can exercise a real read/write split (and the lag / promote-local
  # drills) without paying for AWS. Bootstrap is pg_basebackup -Xs -R -S —
  # see infra/postgres/standby-entrypoint.sh.
  db-replica:
    image: postgres:16
    user: postgres
    environment:
      PRIMARY_HOST: db
      REPLICATOR_USER: replicator
      REPLICATOR_PASSWORD: commerceops
      REPLICATION_SLOT: commerceops_standby
      PGDATA: /var/lib/postgresql/data
    ports:
      - "5433:5432"
    volumes:
      - db_replica_data:/var/lib/postgresql/data
      - ./infra/postgres/standby-entrypoint.sh:/standby-entrypoint.sh:ro
    entrypoint: ["/bin/bash", "/standby-entrypoint.sh"]
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # pg_is_in_recovery() = true means we are a standby serving reads.
      test: ["CMD-SHELL", "pg_isready -U commerceops && psql -U commerceops -d commerceops -tAc 'SELECT pg_is_in_recovery()' | grep -q t"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # V4 (Asynchronous Processing): a real SQS API running locally, so
  # app/core/queue.py and app/worker.py use the exact same boto3 calls here
  # and against real AWS SQS -- see docs/adr/ADR-005-async-processing.md.
  localstack:
    image: localstack/localstack:3
    environment:
      SERVICES: sqs
    ports:
      - "4566:4566"
    volumes:
      - ./infra/localstack/create-queues.sh:/etc/localstack/init/ready.d/create-queues.sh
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 5s
      retries: 20

  # V5 (Reliability): a stand-in third-party payment gateway behind a real
  # HTTP boundary, so timeouts/retries/circuit breaking are exercised against
  # something that can genuinely hang or refuse connections. Fault injection
  # is driven at runtime via POST /admin/chaos -- see
  # loadtest/chaos_experiment.py and docs/adr/ADR-006-reliability.md.
  payment-gateway:
    build: .
    command: uvicorn fake_gateway.main:app --host 0.0.0.0 --port 9000
    environment:
      GATEWAY_SUCCESS_RATE: "0.8"
      GATEWAY_ERROR_RATE: "0"
      GATEWAY_HANG_RATE: "0"
      GATEWAY_LATENCY_MS: "0"
    ports:
      - "9000:9000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9000/health')"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://commerceops:commerceops@db:5432/commerceops
      # V6: product reads go to the hot standby. Same credentials (physical
      # replication); only the host differs. READ_REPLICA_ENABLED=false
      # (or omitting DATABASE_READ_URL) makes the app use the primary for
      # everything — useful when running without db-replica.
      DATABASE_READ_URL: postgresql+psycopg://commerceops:commerceops@db-replica:5432/commerceops
      READ_REPLICA_ENABLED: "true"
      DB_POOL_RECYCLE_SECONDS: "300"
      APP_NAME: CommerceOps AI Platform
      ENVIRONMENT: local
      REDIS_URL: redis://redis:6379/0
      CACHE_TTL_SECONDS: 15
      CACHE_ENABLED: "true"
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      SQS_ENDPOINT_URL: http://localstack:4566
      # V5: the only value that differs from the AWS deployment, where the
      # gateway is a sidecar in the same task and this is http://localhost:9000
      # -- the same shape as SQS_ENDPOINT_URL above.
      PAYMENT_GATEWAY_URL: http://payment-gateway:9000
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      db-replica:
        condition: service_healthy
      redis:
        condition: service_healthy
      localstack:
        condition: service_healthy
      payment-gateway:
        condition: service_healthy

  # V4: the order-events consumer. Scale it to see the backpressure
  # experiment drain faster:
  #   docker compose up -d --scale worker=3 worker
  #
  # V5 (Reliability) gave it a Postgres dependency it deliberately didn't
  # have in V4. Idempotency is no longer "best-effort Redis": the durable
  # record that a side effect already ran lives in the processed_events
  # table, because a Redis key that can be evicted or lost on restart cannot
  # be the only thing standing between a retry and a duplicate business
  # effect. Redis stays in front of it as a cache and as the in-flight lease.
  #
  # V6: READ_REPLICA_ENABLED=false — the worker writes processed_events and
  # must never use the asynchronous replica.
  worker:
    build: .
    command: python -m app.worker
    environment:
      DATABASE_URL: postgresql+psycopg://commerceops:commerceops@db:5432/commerceops
      READ_REPLICA_ENABLED: "false"
      DB_POOL_RECYCLE_SECONDS: "300"
      APP_NAME: CommerceOps AI Platform
      ENVIRONMENT: local
      REDIS_URL: redis://redis:6379/0
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      SQS_ENDPOINT_URL: http://localstack:4566
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      localstack:
        condition: service_healthy

volumes:
  db_data:
  db_replica_data:

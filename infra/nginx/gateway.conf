# V7: path-based edge gateway so clients keep one base URL while Product /
# Order / Payment run as separate processes. Mirrors ALB listener rules in AWS.

upstream product_upstream {
    server product:8000;
}

upstream order_upstream {
    server order:8000;
}

upstream payment_upstream {
    server payment:8000;
}

server {
    listen 8000;

    # Shallow aggregate liveness for local smoke checks.
    location = /health {
        default_type application/json;
        return 200 '{"status":"ok","gateway":true}';
    }

    location /products {
        proxy_pass http://product_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /internal/ {
        proxy_pass http://product_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /customers {
        proxy_pass http://order_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /orders {
        proxy_pass http://order_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /payments {
        proxy_pass http://payment_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Per-service deep probes (optional; not used by ALB).
    location /product/health {
        proxy_pass http://product_upstream/health;
    }
    location /order/health {
        proxy_pass http://order_upstream/health;
    }
    location /payment/health {
        proxy_pass http://payment_upstream/health;
    }
}
